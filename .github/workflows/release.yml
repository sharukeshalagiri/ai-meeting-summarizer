name: Release

# Runs only when a version tag is pushed (git tag v1.2.0 && git push origin v1.2.0).
# Builds the Chrome extension zip and the desktop recorder for Windows,
# macOS and Linux, then publishes one GitHub Release with all of them.
# A tag with a suffix (v1.2.0-rc1) is published as a pre-release.
# macOS and Linux builds are untested: if one fails, the release still
# goes out with what succeeded and its notes say what is missing.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  extension:
    name: extension zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Manifest version matches the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          want="${tag%%-*}"
          have="$(node -p "require('./extension/manifest.json').version")"
          if [ "$have" != "$want" ]; then
            echo "::error::extension/manifest.json version is $have, tag $GITHUB_REF_NAME expects $want"
            exit 1
          fi
      - name: Generated capture code is current
        run: node extension/scripts/build-capture.mjs --check
      - name: Zip
        run: |
          mkdir -p out
          cd extension
          zip -r "../out/meeting-extension-${GITHUB_REF_NAME}.zip" . \
            -x "scripts/*" -x "README.md" -x "*.d.mts"
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: out/*.zip
          if-no-files-found: error

  desktop:
    name: desktop recorder (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.label != 'windows' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, label: windows }
          - { os: macos-latest, label: macos }
          - { os: ubuntu-latest, label: linux }
    defaults:
      run:
        shell: bash
        working-directory: desktop-recorder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: desktop-recorder/requirements*.txt
      - name: Linux audio headers
        if: matrix.label == 'linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libportaudio2
      - run: python -m pip install -r requirements-build.txt
      - name: Tests
        run: |
          python -m pip install "pytest>=8.0"
          python -m pytest -q
      - name: PyInstaller
        run: python -m PyInstaller --noconfirm --clean --windowed --name MeetingRecorder --paths src src/desk_recorder/__main__.py
      - name: Package
        run: |
          mkdir -p ../out
          name="MeetingRecorder-${GITHUB_REF_NAME}-${{ matrix.label }}"
          cd dist
          case "${{ matrix.label }}" in
            windows) 7z a -tzip "../../out/${name}.zip" MeetingRecorder >/dev/null ;;
            macos)   ditto -c -k --keepParent MeetingRecorder.app "../../out/${name}.zip" ;;
            linux)   tar -czf "../../out/${name}.tar.gz" MeetingRecorder ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.label }}
          path: out/*
          if-no-files-found: error

  publish:
    name: publish release
    needs: [extension, desktop]
    if: ${{ always() && needs.extension.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Notes
        run: |
          {
            echo "Chrome extension: unzip, then chrome://extensions → Developer mode → Load unpacked."
            echo "Desktop recorder: unzip and run MeetingRecorder. Create a device token on the Devices page first."
            echo
            for label in windows macos linux; do
              if ! ls out | grep -q -- "-${label}\."; then
                echo "- The ${label} desktop build failed in this run and is not attached."
              fi
            done
          } > notes.md
          ls -la out
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" out/* \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --notes-file notes.md $prerelease
