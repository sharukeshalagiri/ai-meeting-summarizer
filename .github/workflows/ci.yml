name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      # postinstall runs `prisma generate`; no database is needed.
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  frontend:
    name: frontend (typecheck + lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # vitest (src/lib/capture, including the extension-copy check).
      # The job name is unchanged so any required-check settings still match.
      - run: npm test
      - run: npm run build

  ai-service:
    name: ai-service (pytest, fake whisper)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/requirements-dev.txt
      # ffmpeg (with libopus) generates the capture-format fixtures in
      # tests/test_capture_formats.py, which skips without it.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      # Test-only deps: the suite stubs `whisper`, so no torch.
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest

  desktop-recorder:
    name: desktop-recorder (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: desktop-recorder/requirements-dev.txt
      # Creates desktop-recorder/.venv from requirements-dev.txt (no audio
      # devices or tray packages), then runs pytest.
      - run: node desktop-recorder/run-tests.mjs

  scripts:
    name: scripts (ownership rules unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test "scripts/**/*.test.mjs"

  ownership:
    name: ownership
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the merge-base with main can be found.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check changed files against docs/OWNERSHIP.md
        run: node scripts/check-ownership.mjs --base origin/${{ github.base_ref }} --branch "${{ github.head_ref }}"
