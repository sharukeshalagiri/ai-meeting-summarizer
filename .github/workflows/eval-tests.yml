name: Eval tests

# Unit tests of the evaluation harness and the browser e2e test. Both
# use zero Gemini calls: the harness tests answer Gemini with fakes, and
# the e2e test mocks the whole API inside the browser.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: eval-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  harness:
    name: eval harness (typecheck + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            eval/package-lock.json
      # The harness imports the pipeline from backend/src, so it needs the
      # backend's dependencies (postinstall runs prisma generate; no DB).
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: eval
      - run: npm run typecheck
        working-directory: eval
      - run: npm test
        working-directory: eval

  e2e:
    name: e2e (Playwright, chromium, mocked API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: e2e
      - run: npm run typecheck
        working-directory: e2e
      # One browser only: the headless chromium shell.
      - run: npx playwright install --with-deps --only-shell chromium
        working-directory: e2e
      - run: npm test
        working-directory: e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
