name: Eval baseline

# The full accuracy run with REAL Gemini calls (about 28 requests, hard
# cap 30): every synthetic case plus the generated 90-minute meeting and
# the judge. It accepts the report as eval/baseline.json, regenerates the
# README accuracy table and commits all three to the branch it ran on
# (never main), so the result arrives as a reviewable PR.
#
# Runs on pushes to eval/** branches or by hand. Needs the repository
# secret GEMINI_API_KEY; without it the job stops with a notice.

on:
  push:
    branches: ["eval/**"]
  workflow_dispatch:

concurrency:
  group: eval-baseline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  baseline:
    name: eval baseline (full run, real Gemini)
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # lib/env.ts requires it at import; the eval never touches a database.
      DATABASE_URL: postgresql://unused:unused@localhost:5432/unused
      LOG_LEVEL: warn
    steps:
      - name: Check for the Gemini key
        id: key
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::notice title=Eval baseline skipped::No GEMINI_API_KEY repository secret is set."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'
      - uses: actions/setup-node@v4
        if: steps.key.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            eval/package-lock.json
      - if: steps.key.outputs.present == 'true'
        run: npm ci
        working-directory: backend
      - if: steps.key.outputs.present == 'true'
        run: npm ci
        working-directory: eval
      - name: Generate the 90-minute case
        if: steps.key.outputs.present == 'true'
        run: node scripts/eval-gen-long.mjs
      - name: Full evaluation
        if: steps.key.outputs.present == 'true'
        run: npm run eval -- --retry-wait 60
        working-directory: eval
      - name: Report to the job summary
        if: steps.key.outputs.present == 'true' && always()
        run: |
          latest=$(ls -t eval/reports/*.md 2>/dev/null | head -1)
          if [ -n "$latest" ]; then cat "$latest" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Accept as the baseline and update the README table
        if: steps.key.outputs.present == 'true'
        run: |
          npm run eval:accept -- --note "First baseline, run by eval-baseline.yml on ${GITHUB_SHA::7}"
          npm run readme:accuracy
      - name: Commit the results to this branch
        if: steps.key.outputs.present == 'true' && github.ref != 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eval/reports eval/baseline.json README.md
          git commit -m "eval: first accepted baseline (full run, real Gemini)" || exit 0
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.present == 'true' && always()
        with:
          name: eval-baseline-report
          path: eval/reports/
          retention-days: 30
